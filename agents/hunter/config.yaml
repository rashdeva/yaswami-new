# Роль hunter: по вопросу «куда сходить» из чата подбирает событие и пишет черновик ответа; человек ответил —
# продолжает разговор черновиками (docs/agents-inbox.md).
# Ей показывают текст посторонних людей: один инструмент на чтение, памяти нет. Отправляет ответ не она —
# черновик утверждает человек в админке.
_config_version: 53 # формат конфига Hermes 0.23; без метки Hermes считает файл древним и ругается при старте
model:
  default: gpt-6-sol
  provider: openai-codex # вход по подписке ChatGPT — общий, из основного профиля (agents/README.md)
# Когда ChatGPT отказывает (лимит подписки) — Grok по подписке, если она жива. Gemini не берём: бесплатного лимита хватает на пару ответов.
fallback_providers:
  - provider: xai-oauth
    model: grok-4.6
    base_url: https://api.x.ai/v1

platform_toolsets:
  api_server: [mcp-yaswami, skills]
  cli: [mcp-yaswami, skills]

mcp_servers:
  yaswami:
    url: "__MCP_URL__"
    headers:
      Authorization: "Bearer __MCP_TOKEN__"
    tools:
      include: [collected_events_list, hosts_list] # только публичные каталоги: события и организаторы
      resources: false
      prompts: false

memory:
  memory_enabled: false
  user_profile_enabled: false

skills:
  write_approval: true

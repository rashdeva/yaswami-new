# Роль illustrator: по данным события рисует короткий ролик-историю через Grok Imagine (docs/agents-inbox.md).
# Ей показывают текст посторонних людей (название и описание события), поэтому у неё нет ни нашего MCP, ни памяти,
# ни терминала: всё, что она может, — нарисовать ролик и ответить ссылкой. Ссылку сохраняет наш API (support.ts).
_config_version: 53 # формат конфига Hermes 0.23; без метки Hermes считает файл древним и ругается при старте
model:
  default: grok-4.6
  provider: xai-oauth # свой вход: hermes -p illustrator auth add xai-oauth --no-browser
  base_url: https://api.x.ai/v1

platform_toolsets:
  api_server: [skills, video_gen]
  cli: [skills, video_gen]

# Тот же вход по подписке, что и у модели. Ролик остаётся в хранилище xAI, роль получает публичную ссылку.
video_gen:
  provider: xai

memory:
  memory_enabled: false
  user_profile_enabled: false

skills:
  write_approval: true

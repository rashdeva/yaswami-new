# Роль operator: наш собеседник в командном чате Telegram (docs/agents-inbox.md).
# Файл кладётся на том Hermes при каждом старте контейнера (agents/init.sh) — правки делаем здесь, а не на сервере.
_config_version: 53 # формат конфига Hermes 0.23; без метки Hermes считает файл древним и ругается при старте
model:
  default: gpt-5.4
  provider: openai-api # ключ OPENAI_API_KEY (кредиты OpenAI API); init.sh кладёт его в .env профиля
# Когда OpenAI отказывает — Grok по подписке, если она жива. Gemini не берём: бесплатного лимита хватает на пару ответов.
fallback_providers:
  - provider: xai-oauth
    model: grok-4.6
    base_url: https://api.x.ai/v1

# Только то, что нужно оператору. Терминала, файлов, браузера и веба нет:
# через переписку к модели попадает текст посторонних людей.
platform_toolsets:
  telegram: [mcp-yaswami, skills, memory, todo, cronjob]
  api_server: [mcp-yaswami, skills, memory, todo, cronjob]
  cli: [mcp-yaswami, skills, memory, todo, cronjob]

mcp_servers:
  yaswami:
    url: "__MCP_URL__"
    headers:
      Authorization: "Bearer __MCP_TOKEN__"

skills:
  # Hermes умеет дописывать скиллы сам; его правки ждут нашего одобрения (/skills approve).
  write_approval: true

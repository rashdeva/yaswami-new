# Роль support: отвечает людям, которые пишут боту «Я с вами» (docs/agents-inbox.md).
# С ней говорят посторонние: один инструмент на чтение, памяти нет, писать она никому не может —
# её ответ отправляет наш API (apps/api/src/support.ts).
_config_version: 53 # формат конфига Hermes 0.23; без метки Hermes считает файл древним и ругается при старте
model:
  default: gpt-5.4
  provider: openai-api # ключ OPENAI_API_KEY (кредиты OpenAI API); init.sh кладёт его в .env профиля
# Когда OpenAI отказывает — Grok по подписке, если она жива. Gemini не берём: бесплатного лимита хватает на пару ответов.
fallback_providers:
  - provider: xai-oauth
    model: grok-4.6
    base_url: https://api.x.ai/v1

platform_toolsets:
  api_server: [mcp-yaswami, skills]
  cli: [mcp-yaswami, skills]

mcp_servers:
  yaswami:
    url: "__MCP_URL__"
    headers:
      Authorization: "Bearer __MCP_TOKEN__"
    tools:
      # Публичный каталог и события самого собеседника (по билету от нашего API); переписка и чужие события роли не видны.
      include: [collected_events_list, person_events_list, person_events_get, person_events_create, person_events_update]
      resources: false
      prompts: false

# Встроенная память Hermes общая на профиль: сказанное одним человеком всплыло бы у другого.
memory:
  memory_enabled: false
  user_profile_enabled: false

skills:
  write_approval: true

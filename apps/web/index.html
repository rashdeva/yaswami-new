<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Я с вами</title>
    <!-- Серверный HTML нужен поисковикам и медленной сети. Внутри Telegram (он кладёт tgWebAppData в hash) он только мигает без стилей — прячем до старта приложения. -->
    <style>html.tg #app > main { display: none; }</style>
    <script>if (location.hash.includes('tgWebAppData')) document.documentElement.className = 'tg';</script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
